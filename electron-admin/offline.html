<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lamha Studios — Panel de Administración</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0a09;
      color: #f5f2eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      user-select: none;
    }
    .container {
      background: linear-gradient(180deg, #161412 0%, #0e0d0b 100%);
      border: 1px solid rgba(198, 159, 104, 0.25);
      padding: 48px 40px;
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(198, 159, 104, 0.08);
      position: relative;
      overflow: hidden;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #c69f68;
      background: rgba(198, 159, 104, 0.1);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(198, 159, 104, 0.2);
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c69f68;
      animation: pulse 1.5s infinite ease-in-out;
    }
    h1 {
      color: #f5f2eb;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    h1 span {
      color: #c69f68;
    }
    p {
      color: #a89f91;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #99753f, #c69f68, #eed6a8);
      width: 40%;
      border-radius: 999px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    .status-text {
      font-size: 0.8rem;
      color: #c69f68;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      background: linear-gradient(135deg, #c69f68, #a87e45);
      border: none;
      color: #0b0a09;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(198, 159, 104, 0.25);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 30%; }
      50% { width: 60%; }
      100% { transform: translateX(250%); width: 30%; }
    }
  </style>
</head>
<body>
  <div style="-webkit-app-region: drag; position: fixed; top: 0; left: 0; right: 140px; height: 36px; z-index: 9999;"></div>
  <div class="container">
    <div class="badge">
      <div class="badge-dot"></div>
      Lamha Studios Atelier ERP
    </div>
    <h1>Panel <span>Administrador</span></h1>
    <p>Conectando con el motor de almacenamiento local en <strong>C:\Lamha-Storage</strong> y enlace NAS (192.168.11.1)...</p>
    
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
    
    <div class="status-text" id="statusLabel">Iniciando motor de escritorio...</div>

    <div class="btn-group">
      <button onclick="window.desktopAdminAPI && window.desktopAdminAPI.retry ? window.desktopAdminAPI.retry() : location.reload()">
        Reintentar Conexión
      </button>
    </div>
  </div>

  <script>
    let dots = 0;
    setInterval(() => {
      dots = (dots + 1) % 4;
      const el = document.getElementById("statusLabel");
      if (el) {
        el.innerText = "Sincronizando almacenamiento local y base de datos" + ".".repeat(dots);
      }
    }, 500);
  </script>
</body>
</html>
