<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Lam7a Ingestion Widget</title>
  <style>
    :root {
      --bg: #141210;
      --border: #2c251f;
      --text: #f5f2eb;
      --muted: #9c8e7f;
      --gold: #c69f68;
      --gold-dark: #8c6428;
      --success: #10b981;
    }
    [data-theme="light"] {
      --bg: #faf8f5;
      --border: #e8dfd5;
      --text: #2c221a;
      --muted: #7d6c5d;
      --gold: #b38647;
      --gold-dark: #8c6428;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }
    .title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--gold);
      text-transform: uppercase;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .btn-action {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.15s;
    }
    .btn-action:hover {
      color: var(--text);
      border-color: var(--gold);
    }
    /* Progreso principal llamativo con brillo */
    .progress-bar-wrap {
      width: 100%;
      height: 12px;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c69f68, #e4be88, #10b981);
      box-shadow: 0 0 12px rgba(198, 159, 104, 0.6);
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .progress-bar-fill::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.8s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .info-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .file-name {
      font-family: monospace;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      font-size: 11px;
    }
    .percent {
      font-weight: 700;
      color: var(--gold);
      font-size: 13px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
    }
    .stages {
      display: flex;
      gap: 6px;
    }
    .stage-tag {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .stage-tag.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(198, 159, 104, 0.15);
    }
    .stage-tag.done {
      border-color: var(--success);
      color: var(--success);
    }
    [dir="rtl"] {
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <svg viewBox="100 400 750 300" style="width: 24px; height: 16px; fill: var(--gold); display: block;">
        <path d="M805.99,486.53c-.82,1.83-3.51,1.4-3.8-.58-4.38-31.31-23.1-39.11-23.1-39.11-15.71.09,61.92,158.43-10.37,158.43-26.61,0-23.93-9.1-28.57-9.27-4.64-.19-1.44,21.08-6.96,18.55-8.83-4.05-41.53-29.06-45.68-26.41-4.69,3.01-10.35,18.92-38.72,18.92-34.78-1.31-27.42-35.48-25.92-47.03,4.98-3.74,8.5-6.84,10.93-9.19.37,12.24,3.76,26.96,21.84,26.96,32.08.3,46.58-50.29,66.63-50.29,27.46.32,9.81,44.71,41.65,44.71,0,0,20.56.89,21.01-7.57,1.8-33.81-46.2-120.95-10.28-143.77,3.67-2.33,8.47-2,11.72.88,11.55,10.24,30.47,40.26,19.61,64.77Z"/>
        <path d="M615.34,560.8l.03.04c-18.99,12.47-73.99,49.65-176.24,49.65-130.47,0-125.84-48.73-121.22-64.15,4.64-15.42,23.44-39.79,19.44-44.73-4.02-4.94-17.58-7.1-17.58-7.1,0,0-10.18,25.3-16.04,25.6-5.86.32-22.52-10.18-30.54-10.18s6.18-28.07,10.18-28.68c4.02-.62,22.52,11.1,26.22,9.26,3.7-1.86,13.56-26.84,17.88-26.84s28.38,12.34,28.38,15.42-26.22,53.67-25.3,63.55c.94,9.86,16.66,50.63,133.88,38.59,144.04-16.96,175.81-63.58,175.81-63.58l-125.14,13.2c-2.53.22-4.36-2.38-3.31-4.69l9.4-23.78c.49-1.05,1.47-1.79,2.62-1.93,14.76-1.83,113.34-13.82,135.62-12.14,2.48.19,4.35,2.3,4.25,4.78-1.09,24.45-21.95,39.87-28.17,50.13,0,0-.01.03-.04.07-.52.73-5.04,6.94-20.13,17.5Z"/>
      </svg>
      <div class="badge-dot" id="dot"></div>
      <span class="title" id="txt-title">Ingestion en cours</span>
    </div>
    <div class="actions">
      <button class="btn-action" id="btn-expand" title="Agrandir">↗</button>
      <button class="btn-action" id="btn-close" title="Fermer">✕</button>
    </div>
  </div>

  <div class="info-line">
    <span class="file-name" id="txt-file">Initialisation...</span>
    <span class="percent" id="txt-pct">0%</span>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="bar"></div>
  </div>

  <div class="status-row">
    <span id="txt-count">0 / 0 fichiers</span>
    <span id="txt-speed">0.0 MB/s</span>
    <div class="stages">
      <span class="stage-tag" id="tag-copy">SSD</span>
      <span class="stage-tag" id="tag-cloud">Cloud</span>
      <span class="stage-tag" id="tag-nas">NAS</span>
    </div>
  </div>

  <script>
    const bar = document.getElementById("bar");
    const txtFile = document.getElementById("txt-file");
    const txtPct = document.getElementById("txt-pct");
    const txtCount = document.getElementById("txt-count");
    const txtSpeed = document.getElementById("txt-speed");
    const txtTitle = document.getElementById("txt-title");
    const tagCopy = document.getElementById("tag-copy");
    const tagCloud = document.getElementById("tag-cloud");
    const tagNas = document.getElementById("tag-nas");

    const I18N = {
      fr: { title: "Ingestion en cours", done: "Terminé !", cancelled: "Annulé" },
      es: { title: "Ingesta en curso", done: "¡Completado!", cancelled: "Cancelado" },
      en: { title: "Ingestion running", done: "Finished!", cancelled: "Cancelled" },
      ar: { title: "جارٍ التفريغ...", done: "تم بنجاح!", cancelled: "تم الإلغاء" }
    };

    let lang = "fr";

    function updateUI(ev) {
      if (!ev) return;
      if (ev.type === "progress") {
        const p = ev.percent || 0;
        bar.style.width = p + "%";
        txtPct.textContent = Math.round(p) + "%";
        if (ev.currentFile) txtFile.textContent = ev.currentFile;
        txtCount.textContent = `${ev.processed || 0} / ${ev.total || 0}`;
        txtSpeed.textContent = (ev.speed || 0) + " MB/s";

        if (ev.stages) {
          updateTag(tagCopy, ev.stages.copy);
          updateTag(tagCloud, ev.stages.cloud);
          updateTag(tagNas, ev.stages.nas);
        }
      } else if (ev.type === "done") {
        bar.style.width = "100%";
        txtPct.textContent = "100%";
        txtTitle.textContent = (I18N[lang] || I18N.fr).done;
        txtFile.textContent = ev.summary ? `Client: ${ev.summary.client || "OK"}` : "Prêt";
        document.getElementById("dot").style.background = "#10b981";
        document.getElementById("dot").style.boxShadow = "0 0 8px #10b981";
      } else if (ev.type === "cancelled") {
        txtTitle.textContent = (I18N[lang] || I18N.fr).cancelled;
      }
    }

    function updateTag(el, stage) {
      if (!el || !stage) return;
      el.className = "stage-tag";
      if (stage.state === "done") el.classList.add("done");
      else if (stage.state === "active") el.classList.add("active");
    }

    document.getElementById("btn-expand").onclick = () => window.electronAPI.miniExpand();
    document.getElementById("btn-close").onclick = () => window.electronAPI.miniClose();

    if (window.electronAPI) {
      window.electronAPI.miniGetState().then((s) => {
        if (s) {
          lang = s.lang || "fr";
          txtTitle.textContent = (I18N[lang] || I18N.fr).title;
          if (s.theme) document.documentElement.setAttribute("data-theme", s.theme);
          if (s.lang === "ar") document.documentElement.setAttribute("dir", "rtl");
          if (s.last) updateUI(s.last);
        }
      });
      window.electronAPI.onIngestEvent(updateUI);
      window.electronAPI.onLanguageChanged((l) => {
        lang = l;
        txtTitle.textContent = (I18N[lang] || I18N.fr).title;
        document.documentElement.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
      });
    }
  </script>
</body>
</html>
